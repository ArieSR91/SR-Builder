plugins {
    id 'com.android.application'
}

def keystoreConfigFile = file('keystore.config')
def hasReleaseKeystore = keystoreConfigFile.exists()

android {
    namespace = 'com.fastsmartsystem.cleoeditor'
    compileSdk = 35

    // A local signing key is optional for debug builds. Keep release signing
    // configured only when the developer has supplied app/keystore.config.
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                Properties keystoreProps = new Properties()
                keystoreConfigFile.withInputStream { stream -> keystoreProps.load(stream) }

                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
                storePassword = keystoreProps['storePassword']
                storeFile = file(keystoreProps['keyPath'])
            }
        }
    }

    defaultConfig {
        applicationId = "com.ariesr91.builder"
        minSdk = 21
        targetSdk = 35
        versionCode = 2
        versionName = "1.1"
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        dataBinding = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // ViewModel and LiveData - work with save viewModel  state
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.navigation:navigation-ui:2.8.6'
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.8.7'
    implementation project(path: ':editor')
}
